map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# TMDB responses are cached briefly (see fancyfin-tmdb.conf).
proxy_cache_path /var/cache/nginx/tmdb levels=1:2 keys_zone=tmdb:5m max_size=50m inactive=2h use_temp_path=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The Jellyfin proxy (/api/). Written at container start by docker/10-fancyfin-proxy.sh:
    # a real proxy when JELLYFIN_URL is set, otherwise a stub and the app asks for the server address.
    include /etc/nginx/fancyfin-proxy.conf;

    # TMDB, for the featured banner. Written at container start by the same script:
    # a real proxy when TMDB_API_KEY is set, otherwise a stub.
    include /etc/nginx/fancyfin-tmdb.conf;

    # Radarr and Sonarr settings and Add calls. Handled by the small Fancyfin settings service
    # (server/arr-server.mjs), which keeps the API keys saved from Settings. If it isn't running this
    # answers 502 and the app hides the Radarr and Sonarr features.
    location /arr/ {
        proxy_pass http://127.0.0.1:8283;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        client_max_body_size 1m;
        add_header Cache-Control "no-store";
    }

    # Tells the app whether the proxy is configured. Written at container start; never cached.
    location = /config.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Hashed build assets are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app fallback.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
