map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The Jellyfin proxy (/api/). Written at container start by docker/10-fancyfin-proxy.sh:
    # a real proxy when JELLYFIN_URL is set, otherwise a stub and the app asks for the server address.
    include /etc/nginx/fancyfin-proxy.conf;

    # Tells the app whether the proxy is configured. Written at container start; never cached.
    location = /config.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Hashed build assets are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app fallback.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
