name: Android TV app

# Builds the Android TV app (android/).
#   push or pull request touching android/ -> a debug build, to check it still compiles
#   tag tv-v0.1.0                          -> a signed release APK attached to a GitHub release,
#                                             which the app's built-in updater finds
# See android/README.md for the one-time signing key setup.
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
    tags: ["tv-v*"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Work out the version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/tv-v* ]]; then
            echo "version=${GITHUB_REF_NAME#tv-v}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Debug build
        if: steps.version.outputs.release != 'true'
        run: gradle -p android assembleDebug

      - name: Load the signing key
        if: steps.version.outputs.release == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets first (see android/README.md)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fancyfin.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/fancyfin.jks" >> "$GITHUB_ENV"

      - name: Release build
        if: steps.version.outputs.release == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle -p android assembleRelease -PversionName=${{ steps.version.outputs.version }}
          cp android/app/build/outputs/apk/release/app-release.apk fancyfin-tv.apk

      - name: Keep the debug build
        if: steps.version.outputs.release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fancyfin-tv-debug
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Publish the release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Fancyfin TV ${{ steps.version.outputs.version }}
          files: fancyfin-tv.apk
          generate_release_notes: true
