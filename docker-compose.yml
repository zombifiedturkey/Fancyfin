services:
  fancyfin:
    # Build locally:
    build: .
    # ...or use the published image (:edge follows main, :latest follows releases):
    # image: ghcr.io/zombifiedturkey/fancyfin:edge
    container_name: fancyfin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      # Optional. Address of your Jellyfin server as reachable from this container.
      # Leave it out (or empty) and Fancyfin asks for the address the first time you open it.
      JELLYFIN_URL: ""
      # Optional. A TMDB API key (or read access token) turns on the "popular right now" banner.
      # It stays on the server; the browser never sees it. Leave it out to use recently added titles.
      TMDB_API_KEY: ""
    volumes:
      # Where Settings saves the Radarr and Sonarr connection (needs JELLYFIN_URL above).
      - ./config:/config
